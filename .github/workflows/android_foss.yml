name: Android CI FOSS

on:
  workflow_dispatch:
  push:
    branches:
      - feature/maze-generator

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: actions/checkout@v7

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          java-package: 'jdk'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Set up Keystore
        run: |
          sudo apt update -y || true
          sudo apt install -y --no-install-recommends coreutils
          mkdir -p $RUNNER_TEMP/keystores
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > $RUNNER_TEMP/keystores/keystore.jks

      - name: Build FOSS APKs
        run: bash ./gradlew :core:domain:testFossDebugUnitTest :core:data:testFossDebugUnitTest :feature:maze-generation:testFossDebugUnitTest :app:assembleFossRelease --stacktrace

      - name: Record runtime dependencies
        run: bash ./gradlew :app:dependencies --configuration fossReleaseRuntimeClasspath > "$RUNNER_TEMP/ezmaze-dependencies.txt"

      - name: Upload maze test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ezMaze-test-results
          path: |
            core/domain/build/test-results/**/TEST-*.xml
            core/data/build/test-results/**/TEST-*.xml
            feature/maze-generation/build/test-results/**/TEST-*.xml
          if-no-files-found: warn

      - name: Upload dependency report
        uses: actions/upload-artifact@v7
        with:
          name: ezMaze-dependencies.txt
          path: ${{ runner.temp }}/ezmaze-dependencies.txt
          archive: false

      - name: Sign FOSS APKs
        run: |
          ANDROID_SDK_PATH=$ANDROID_HOME/build-tools/35.0.0/apksigner
          for apk in app/build/outputs/apk/foss/release/*.apk; do
            $ANDROID_SDK_PATH sign \
              --ks $RUNNER_TEMP/keystores/keystore.jks \
              --ks-key-alias iqonli-1 \
              --ks-pass pass:${{ secrets.KEY_STORE_PASS }} \
              --key-pass pass:${{ secrets.KEY_STORE_PASS }} \
              --out "$apk" \
              "$apk"
            $ANDROID_SDK_PATH verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.iqonli.ezmaze'"
          done

      - name: Prepare individual APKs and build notes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/maze-apks"
          for abi in armeabi-v7a arm64-v8a x86_64 universal; do
            mapfile -t apks < <(find app/build/outputs/apk/foss/release -maxdepth 1 -type f -name "*${abi}*.apk")
            if [ "${#apks[@]}" -ne 1 ]; then
              echo "Expected one APK for $abi, found ${#apks[@]}" >&2
              exit 1
            fi
            cp "${apks[0]}" "$RUNNER_TEMP/maze-apks/ezMaze-${abi}.apk"
          done
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTES'
          ### Maze Generator FOSS build
          - Package: `com.iqonli.ezmaze` (installs alongside the original app).
          - Signing alias: `iqonli-1`; independent Apache-2.0 fork of Image Toolbox.
          - Each signed APK is uploaded individually without a ZIP wrapper.
          NOTES

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: ezMaze-arm64-v8a.apk
          path: ${{ runner.temp }}/maze-apks/ezMaze-arm64-v8a.apk
          archive: false
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v7
        with:
          name: ezMaze-armeabi-v7a.apk
          path: ${{ runner.temp }}/maze-apks/ezMaze-armeabi-v7a.apk
          archive: false
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          name: ezMaze-x86_64.apk
          path: ${{ runner.temp }}/maze-apks/ezMaze-x86_64.apk
          archive: false
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: ezMaze-universal.apk
          path: ${{ runner.temp }}/maze-apks/ezMaze-universal.apk
          archive: false
          if-no-files-found: error

      - name: Delete FOSS APKs
        run: rm -rf app/build/outputs/apk/foss