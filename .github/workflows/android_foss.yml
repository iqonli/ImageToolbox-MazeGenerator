name: Android CI FOSS

on:
  workflow_dispatch:
  push:
    branches:
      - feature/maze-generator

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: actions/checkout@v7

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          java-package: 'jdk'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Set up Keystore
        run: |
          sudo apt update -y || true
          sudo apt install -y --no-install-recommends coreutils
          mkdir -p $RUNNER_TEMP/keystores
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > $RUNNER_TEMP/keystores/keystore.jks

      - name: Build FOSS APKs
        run: bash ./gradlew :core:domain:testFossDebugUnitTest :core:data:testFossDebugUnitTest :feature:maze-generation:testFossDebugUnitTest :app:assembleFossRelease --stacktrace

      - name: Summarize unit tests
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          summary = []
          for module in ['core/domain', 'core/data', 'feature/maze-generation']:
              suites = [ET.parse(p).getroot() for p in Path(module, 'build/test-results/testFossDebugUnitTest').glob('TEST-*.xml')]
              tests = sum(int(s.get('tests', 0)) for s in suites)
              failures = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
              skipped = sum(int(s.get('skipped', 0)) for s in suites)
              assert tests > 0 and failures == 0, (module, tests, failures)
              summary.append(f'- {module}: {tests} tests, {failures} failures, {skipped} skipped')
          text = '\n'.join(summary) + '\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('### Unit tests\n' + text)
          PYTEST

      - name: Record runtime dependencies
        run: bash ./gradlew :app:dependencies --configuration fossReleaseRuntimeClasspath | tee "$RUNNER_TEMP/ezmaze-dependencies.txt"

      - name: Upload maze test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ezMaze-test-results
          path: |
            core/domain/build/test-results/**/TEST-*.xml
            core/data/build/test-results/**/TEST-*.xml
            feature/maze-generation/build/test-results/**/TEST-*.xml
          if-no-files-found: warn

      - name: Upload dependency report
        uses: actions/upload-artifact@v7
        with:
          name: ezMaze-dependencies.txt
          path: ${{ runner.temp }}/ezmaze-dependencies.txt
          archive: false

      - name: Sign FOSS APKs
        run: |
          ANDROID_SDK_PATH=$ANDROID_HOME/build-tools/35.0.0/apksigner
          for apk in app/build/outputs/apk/foss/release/*.apk; do
            $ANDROID_SDK_PATH sign \
              --ks $RUNNER_TEMP/keystores/keystore.jks \
              --ks-key-alias iqonli-1 \
              --ks-pass pass:${{ secrets.KEY_STORE_PASS }} \
              --key-pass pass:${{ secrets.KEY_STORE_PASS }} \
              --out "$apk" \
              "$apk"
            $ANDROID_SDK_PATH verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.iqonli.ezmaze'"
          done

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify release startup and SVG saving on Android
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            adb install -r app/build/outputs/apk/foss/release/*x86_64*.apk
            adb logcat -c
            adb shell am start -W -n com.iqonli.ezmaze/.MazeActivity
            sleep 5
            adb shell pidof com.iqonli.ezmaze || (adb logcat -d -s AndroidRuntime && exit 1)
            adb shell uiautomator dump /sdcard/ezmaze-window.xml
            adb shell cat /sdcard/ezmaze-window.xml | grep 'ezMaze'
            adb exec-out screencap -p > "$RUNNER_TEMP/ezmaze-startup.png"
            bash ./gradlew :core:data:connectedFossDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.t8rin.imagetoolbox.core.data.saving.SvgSavingInstrumentedTest --stacktrace
            bash ./gradlew :feature:maze-generation:connectedFossDebugAndroidTest --stacktrace

      - name: Upload Android verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ezMaze-android-verification
          path: |
            ${{ runner.temp }}/ezmaze-startup.png
            core/data/build/outputs/androidTest-results/**
            feature/maze-generation/build/outputs/androidTest-results/**
          if-no-files-found: warn

      - name: Prepare individual APKs and build notes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/maze-apks"
          for abi in armeabi-v7a arm64-v8a x86_64 universal; do
            mapfile -t apks < <(find app/build/outputs/apk/foss/release -maxdepth 1 -type f -name "*${abi}*.apk")
            if [ "${#apks[@]}" -ne 1 ]; then
              echo "Expected one APK for $abi, found ${#apks[@]}" >&2
              exit 1
            fi
            cp "${apks[0]}" "$RUNNER_TEMP/maze-apks/ezMaze-${abi}.apk"
          done
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTES'
          ### Maze Generator FOSS build
          - Package: `com.iqonli.ezmaze` (installs alongside the original app).
          - Signing alias: `iqonli-1`; independent Apache-2.0 fork of Image Toolbox.
          - Each signed APK is uploaded individually without a ZIP wrapper.
          NOTES

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: ezMaze-arm64-v8a.apk
          path: ${{ runner.temp }}/maze-apks/ezMaze-arm64-v8a.apk
          archive: false
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v7
        with:
          name: ezMaze-armeabi-v7a.apk
          path: ${{ runner.temp }}/maze-apks/ezMaze-armeabi-v7a.apk
          archive: false
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          name: ezMaze-x86_64.apk
          path: ${{ runner.temp }}/maze-apks/ezMaze-x86_64.apk
          archive: false
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: ezMaze-universal.apk
          path: ${{ runner.temp }}/maze-apks/ezMaze-universal.apk
          archive: false
          if-no-files-found: error

      - name: Delete FOSS APKs
        run: rm -rf app/build/outputs/apk/foss