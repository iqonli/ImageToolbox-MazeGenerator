name: Android CI FOSS

on:
  workflow_dispatch:
  push:
    branches:
      - feature/maze-generator

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: actions/checkout@v7

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          java-package: 'jdk'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Set up Keystore
        run: |
          sudo apt update -y || true
          sudo apt install -y --no-install-recommends coreutils
          mkdir -p $RUNNER_TEMP/keystores
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > $RUNNER_TEMP/keystores/keystore.jks

      - name: Build FOSS APKs
        run: bash ./gradlew assembleFossRelease

      - name: Sign FOSS APKs
        run: |
          ANDROID_SDK_PATH=$ANDROID_HOME/build-tools/35.0.0/apksigner
          for apk in app/build/outputs/apk/foss/release/*.apk; do
            $ANDROID_SDK_PATH sign \
              --ks $RUNNER_TEMP/keystores/keystore.jks \
              --ks-key-alias ${{ secrets.ALIAS }} \
              --ks-pass pass:${{ secrets.KEY_STORE_PASS }} \
              --key-pass pass:${{ secrets.KEY_STORE_PASS }} \
              --out "$apk" \
              "$apk"
          done

      - name: Prepare individual APKs and build notes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/maze-apks"
          for abi in armeabi-v7a arm64-v8a x86_64 universal; do
            mapfile -t apks < <(find app/build/outputs/apk/foss/release -maxdepth 1 -type f -name "*${abi}*.apk")
            if [ "${#apks[@]}" -ne 1 ]; then
              echo "Expected one APK for $abi, found ${#apks[@]}" >&2
              exit 1
            fi
            cp "${apks[0]}" "$RUNNER_TEMP/maze-apks/ImageToolbox-MazeGenerator-${abi}.apk"
          done
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTES'
          ### Maze Generator FOSS build
          - Package: `ru.tech.imageresizershrinker.iqonli` (installs alongside the original app).
          - Fork suffix: `.iqonli`; remove it from `applicationId` and both `file_provider` values in `app/build.gradle.kts` to restore upstream identifiers.
          - Each signed APK is uploaded individually without a ZIP wrapper.
          NOTES

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: ImageToolbox-MazeGenerator-arm64-v8a.apk
          path: ${{ runner.temp }}/maze-apks/ImageToolbox-MazeGenerator-arm64-v8a.apk
          archive: false
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v7
        with:
          name: ImageToolbox-MazeGenerator-armeabi-v7a.apk
          path: ${{ runner.temp }}/maze-apks/ImageToolbox-MazeGenerator-armeabi-v7a.apk
          archive: false
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          name: ImageToolbox-MazeGenerator-x86_64.apk
          path: ${{ runner.temp }}/maze-apks/ImageToolbox-MazeGenerator-x86_64.apk
          archive: false
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: ImageToolbox-MazeGenerator-universal.apk
          path: ${{ runner.temp }}/maze-apks/ImageToolbox-MazeGenerator-universal.apk
          archive: false
          if-no-files-found: error

      - name: Delete FOSS APKs
        run: rm -rf app/build/outputs/apk/foss